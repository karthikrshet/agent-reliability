[project]
name = "arl-protocol"
version = "0.1.0"
description = "Agent Reliability Lab — stable framework-independent agent adapter protocol"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
