[project]
name = "arl-execution-engine"
version = "0.1.0"
description = "Agent Reliability Lab — stateful execution engine, tool proxy, and budget enforcement"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "arl-protocol",
    "arl-scenario-engine",
    "arl-fault-engine",
    "pydantic>=2.9",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
