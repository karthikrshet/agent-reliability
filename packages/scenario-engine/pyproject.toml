[project]
name = "arl-scenario-engine"
version = "0.1.0"
description = "Agent Reliability Lab — scenario schema, validation, and fail-closed loader"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "jmespath>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
