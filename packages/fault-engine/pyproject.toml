[project]
name = "arl-fault-engine"
version = "0.1.0"
description = "Agent Reliability Lab — seed-controlled deterministic fault injection engine"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "arl-scenario-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
