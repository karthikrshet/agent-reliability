[project]
name = "arl-core"
version = "0.1.0"
description = "Agent Reliability Lab — core domain model, state machine, and error types"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "ulid-py>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
