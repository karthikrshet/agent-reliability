[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arl-grading-engine"
version = "0.1.0"
description = "Deterministic rule grading, semantic LLM judges, and statistical metrics for Agent Reliability Lab"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "arl-core>=0.1.0",
    "arl-protocol>=0.1.0",
    "arl-scenario-engine>=0.1.0",
    "arl-execution-engine>=0.1.0",
    "pydantic>=2.7.0",
    "jmespath>=1.0.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
