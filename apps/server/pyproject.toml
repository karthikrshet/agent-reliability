[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arl-server"
version = "0.1.0"
description = "FastAPI evaluation and orchestration REST API server for Agent Reliability Lab"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "arl-core>=0.1.0",
    "arl-protocol>=0.1.0",
    "arl-scenario-engine>=0.1.0",
    "arl-fault-engine>=0.1.0",
    "arl-execution-engine>=0.1.0",
    "arl-grading-engine>=0.1.0",
    "arl-evidence>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
