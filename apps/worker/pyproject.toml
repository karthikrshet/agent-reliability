[project]
name = "arl-worker"
version = "0.1.0"
description = "Agent Reliability Lab — distributed execution worker with lease management"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "arl-protocol",
    "arl-scenario-engine",
    "arl-fault-engine",
    "arl-execution-engine",
    "arl-env-customer-support",
    "arl-adapter-http",
    "arl-adapter-reference",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
