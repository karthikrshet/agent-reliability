[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arl-cli"
version = "0.1.0"
description = "Command-line interface (agentlab) for Agent Reliability Lab"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "arl-core>=0.1.0",
    "arl-protocol>=0.1.0",
    "arl-scenario-engine>=0.1.0",
    "arl-fault-engine>=0.1.0",
    "arl-execution-engine>=0.1.0",
    "arl-grading-engine>=0.1.0",
    "arl-evidence>=0.1.0",
    "arl-customer-support>=0.1.0",
    "arl-reference-adapter>=0.1.0",
    "arl-http-adapter>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
agentlab = "arl.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
