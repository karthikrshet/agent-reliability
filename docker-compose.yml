services:
  postgres:
    image: postgres:16-alpine
    container_name: arl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arl_dev}
      POSTGRES_USER: ${POSTGRES_USER:-arl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arl_secret_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arl} -d ${POSTGRES_DB:-arl_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arl-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: arl-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arl}:${POSTGRES_PASSWORD:-arl_secret_dev_only}@postgres:5432/${POSTGRES_DB:-arl_dev}
      REDIS_URL: redis://redis:6379/0
      ARL_ENVIRONMENT: development
      ARL_SECRET_KEY: ${ARL_SECRET_KEY:-dev-insecure-secret-key-replace-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: arl-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arl}:${POSTGRES_PASSWORD:-arl_secret_dev_only}@postgres:5432/${POSTGRES_DB:-arl_dev}
      REDIS_URL: redis://redis:6379/0
      ARL_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: arl-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
