name: Bug Report
description: Report a defect, unexpected fault behavior, or grading inconsistency in ARL
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: ARL Version
      description: What version of Agent Reliability Lab are you running? (e.g., v0.2.0-beta)
      placeholder: v0.2.0-beta
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, scenario file, or code used to trigger the issue.
      placeholder: |
        1. Run `agentlab run -s scenarios/...`
        2. Injected fault ...
        3. Observed error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Observable Trajectory / Logs
      description: Please paste any relevant error logs or trajectory outputs (ensure API keys and secrets are redacted!).
      render: shell
