name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**", "backup/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint-typecheck-test:
    name: Python Lint, Type Check & Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov hypothesis \
                      sqlalchemy alembic fastapi uvicorn httpx typer rich \
                      scipy pyyaml jsonschema jmespath pydantic pydantic-settings \
                      types-PyYAML types-jsonschema
          pip install -e "packages/core" \
                      -e "packages/protocol" \
                      -e "packages/scenario-engine" \
                      -e "packages/fault-engine" \
                      -e "packages/execution-engine" \
                      -e "packages/grading-engine" \
                      -e "packages/evidence" \
                      -e "environments/customer-support" \
                      -e "adapters/reference" \
                      -e "adapters/http" \
                      -e "adapters/openai-agents" \
                      -e "apps/worker" \
                      -e "apps/server" \
                      -e "apps/cli" \
                      -e "apps/mcp"

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Strict MyPy Type Checker
        run: |
          mypy packages apps adapters environments

      - name: Run Full Pytest Suite with Coverage
        run: |
          export PYTHONPATH="packages/core/src:packages/protocol/src:packages/scenario-engine/src:packages/fault-engine/src:packages/execution-engine/src:packages/grading-engine/src:packages/evidence/src:environments/customer-support/src:adapters/reference/src:adapters/http/src:adapters/openai-agents/src:apps/worker/src:apps/server/src:apps/cli/src:apps/mcp/src"
          pytest -v --cov-fail-under=85

  scenario-validation:
    name: Validate 25 Canonical Scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scenario engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema jmespath pydantic
          pip install -e packages/core
          pip install -e packages/scenario-engine

      - name: Validate all YAML scenarios
        run: |
          python -c "
          import glob, sys
          from arl.scenario_engine.loader import validate_scenario_file
          files = sorted(glob.glob('scenarios/**/*.yaml', recursive=True))
          print(f'Found {len(files)} scenarios to validate.')
          all_errors = {}
          for f in files:
              errs = validate_scenario_file(f)
              if errs:
                  all_errors[f] = errs
                  print(f'FAIL: {f} -> {errs}')
              else:
                  print(f'PASS: {f}')
          if all_errors:
              print(f'\nTotal failures: {len(all_errors)}')
              sys.exit(1)
          print('\nAll 25 canonical scenarios validated successfully!')
          "

  dashboard-build:
    name: Next.js 15 Web Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies & Build Next.js Dashboard
        working-directory: apps/dashboard
        run: |
          npm ci || npm install
          npm run build
