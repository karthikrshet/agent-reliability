name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**", "backup/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  python-lint-typecheck-test:
    name: Python Lint, Type Check & Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arl_test
          POSTGRES_USER: arl_user
          POSTGRES_PASSWORD: arl_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov hypothesis \
                      sqlalchemy alembic asyncpg psycopg2-binary fastapi uvicorn httpx typer rich \
                      scipy pyyaml jsonschema jmespath pydantic pydantic-settings \
                      types-PyYAML types-jsonschema
          pip install -e "packages/core" \
                      -e "packages/protocol" \
                      -e "packages/scenario-engine" \
                      -e "packages/fault-engine" \
                      -e "packages/execution-engine" \
                      -e "packages/grading-engine" \
                      -e "packages/evidence" \
                      -e "environments/customer-support" \
                      -e "adapters/reference" \
                      -e "adapters/http" \
                      -e "adapters/openai-agents" \
                      -e "apps/worker" \
                      -e "apps/server" \
                      -e "apps/cli" \
                      -e "apps/mcp"

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Strict MyPy Type Checker
        run: |
          mypy packages apps adapters environments

      - name: Run Full Pytest Suite with Coverage Gate (>=85%)
        env:
          ARL_TEST_POSTGRES_URL: postgresql+asyncpg://arl_user:arl_password@localhost:5432/arl_test
          PYTHONPATH: "packages/core/src:packages/protocol/src:packages/scenario-engine/src:packages/fault-engine/src:packages/execution-engine/src:packages/grading-engine/src:packages/evidence/src:environments/customer-support/src:adapters/reference/src:adapters/http/src:adapters/openai-agents/src:apps/worker/src:apps/server/src:apps/cli/src:apps/mcp/src:."
        run: |
          pytest -v --cov=packages --cov=apps --cov=adapters --cov=environments --cov-report=xml --cov-report=term-missing --cov-fail-under=85

  scenario-validation:
    name: Validate 25 Canonical Scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install scenario engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema jmespath pydantic
          pip install -e packages/core
          pip install -e packages/scenario-engine

      - name: Validate all YAML scenarios
        run: |
          python -c "
          import glob, sys
          from arl.scenario_engine.loader import validate_scenario_file
          files = sorted(glob.glob('scenarios/**/*.yaml', recursive=True))
          print(f'Found {len(files)} scenarios to validate.')
          all_errors = {}
          for f in files:
              errs = validate_scenario_file(f)
              if errs:
                  all_errors[f] = errs
                  print(f'FAIL: {f} -> {errs}')
              else:
                  print(f'PASS: {f}')
          if all_errors:
              print(f'\nTotal failures: {len(all_errors)}')
              sys.exit(1)
          print('\nAll 25 canonical scenarios validated successfully!')
          "

  dashboard-build:
    name: Next.js 15 Web Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "20"

      - name: Strict Deterministic Install & Build Next.js Dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

  docker-compose-validate:
    name: Docker Compose Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  security-and-codeql:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.28.10
        with:
          languages: python, javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.28.10
        with:
          category: "/language:python,javascript-typescript"

  generate-sbom:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: "arl-sbom.spdx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: arl-sbom-spdx
          path: arl-sbom.spdx.json
