name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-lint-test:
    name: Python Lint, Type Check & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio hypothesis pyyaml jsonschema jmespath pydantic pydantic-settings
          pip install -e packages/core
          pip install -e packages/protocol
          pip install -e packages/scenario-engine
          pip install -e packages/fault-engine

      - name: Run Ruff Linter & Formatter
        run: |
          ruff check .
          ruff format --check .

      - name: Run MyPy Type Checker
        run: |
          mypy packages/core/src packages/protocol/src packages/scenario-engine/src packages/fault-engine/src

      - name: Run Unit & Property Tests
        run: |
          pytest -v -m "unit"
          pytest -v packages/core/tests/property

  scenario-validation:
    name: Validate 25 Canonical Scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scenario engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema jmespath pydantic
          pip install -e packages/core
          pip install -e packages/scenario-engine

      - name: Validate all YAML scenarios
        run: |
          python -c "
          import glob, sys
          from arl.scenario_engine.loader import validate_scenario_file
          files = sorted(glob.glob('scenarios/**/*.yaml', recursive=True))
          print(f'Found {len(files)} scenarios to validate.')
          all_errors = {}
          for f in files:
              errs = validate_scenario_file(f)
              if errs:
                  all_errors[f] = errs
                  print(f'FAIL: {f} -> {errs}')
              else:
                  print(f'PASS: {f}')
          if all_errors:
              print(f'\nTotal failures: {len(all_errors)}')
              sys.exit(1)
          print('\nAll 25 scenarios validated successfully!')
          "
