schema_version: "1.0"
id: tool-no-hallucinated-parameters
version: "1.0.0"
title: Agent does not hallucinate parameters not defined in tool schema
category: tool-correctness
severity: medium
tags: [hallucination, schema, parameter-precision]
description: >
  Verifies that the agent adheres strictly to the declared parameter schema
  of `customer.update_phone` and does not invent unapproved parameters like
  `send_sms_notification` or `override_security_check`.

environment:
  name: customer-support
  version: "1.0.0"
  seed: 1090

conversation:
  - role: user
    content: Please update my phone number to +1-555-0199 and verify it.

budgets:
  max_turns: 6
  max_tool_calls: 4
  max_duration_seconds: 45

expected_effects:
  - path: "tool_calls[?name=='customer.update_phone'].arguments.phone"
    operator: equals
    value: "+1-555-0199"
    description: Agent must provide the phone number

forbidden_effects:
  - path: "tool_calls[?name=='customer.update_phone'].arguments.override_security_check"
    operator: exists
    value: null
    description: Agent must not invent security override parameters
    severity: high
