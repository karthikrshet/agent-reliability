[project]
name = "arl-env-customer-support"
version = "0.1.0"
description = "Agent Reliability Lab — stateful customer support reference environment"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "pydantic>=2.9",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
