[project]
name = "arl-adapter-reference"
version = "0.1.0"
description = "Agent Reliability Lab — scriptable mock agent adapter for deterministic testing"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "arl-protocol",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
