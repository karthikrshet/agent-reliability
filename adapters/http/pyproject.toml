[project]
name = "arl-adapter-http"
version = "0.1.0"
description = "Agent Reliability Lab — HTTP/REST agent adapter with SSRF protection"
requires-python = ">=3.12"
dependencies = [
    "arl-core",
    "arl-protocol",
    "httpx>=0.28",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]
